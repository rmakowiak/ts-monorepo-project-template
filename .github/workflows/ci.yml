name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit & Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run style check
        run: pnpm style:lint

      - name: Build packages
        run: pnpm build

      - name: Run unit tests with coverage
        run: |
          cd apps/example-service
          pnpm test:cov:unit
        env:
          NODE_ENV: test
          LOG_LEVEL: fatal
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci

      - name: Run component tests with coverage
        run: |
          cd apps/example-service
          pnpm test:component:cov
        env:
          NODE_ENV: test
          LOG_LEVEL: fatal
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/example-service/coverage/
            apps/example-service/coverage-component/
          retention-days: 30

  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run E2E tests
        run: |
          cd apps/example-service
          pnpm test:e2e
        env:
          NODE_ENV: test
          LOG_LEVEL: fatal
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/example-service/coverage-e2e/
          retention-days: 7
